<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>

<main>

    <section>
        <h1>Contact us</h1>

      <form>
        <label for="email">E-mail</label>
        <input class="inputField inputField--email" type="email" id="email" name="email" placeholder="example@email.com" required>

        <label for="subject">Subject</label>
        <input class="inputField inputField--subject" type="text" id="subject" name="subject" required>

        <label for="message">Message</label>
        <textarea class="inputField inputField--message" id="message" name="message" required></textarea>

        <label for="agreement">Do you agree?</label>
        <input cass="checkbox" type="checkbox" id="agreement" name="agreement">

        <button type="submit">Send</button>

    </form>
</section>

</main>
</body>
</html>
